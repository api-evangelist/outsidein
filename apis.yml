name: Outside.in
description: >-
  Outside.in was a hyperlocal news aggregation service that clustered blog posts and local news by
  geography ("placeblogging"), founded in 2006 and backed by Union Square Ventures and Milestone
  Venture Partners. It was acquired by AOL in 2011 and folded into the Patch local-news network; the
  standalone product and its geo-tagging API were subsequently shut down. The company is defunct: the
  outside.in domain no longer serves a website and there is no live developer portal, documentation, or
  API surface to enrich. This profile is retained as a historical/portfolio-lead record.
